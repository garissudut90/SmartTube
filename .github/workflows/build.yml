name: Build Release

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout beserta submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Tentukan nama rilis
        run: echo "TAG=build-$(date -u +%Y%m%d)-${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Build APK release
        run: |
          chmod +x gradlew
          ./gradlew clean assembleStstableRelease --stacktrace

      - name: Siapkan keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Align dan tanda tangani semua APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          KS="$RUNNER_TEMP/release.jks"
          ALIAS=$(keytool -list -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" 2>/dev/null | awk -F', ' '/PrivateKeyEntry/ {print $1; exit}')
          if [ -z "$ALIAS" ]; then
            echo "Keystore tidak berisi private key (PrivateKeyEntry)."
            keytool -list -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" || true
            exit 1
          fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          mkdir -p release-apks
          find smarttubetv/build/outputs/apk -name '*.apk' -path '*ststable*' -path '*release*' | while read -r APK; do
            NAME=$(basename "$APK")
            echo "Menandatangani $NAME"
            "$BT/zipalign" -p -f 4 "$APK" "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" sign \
              --ks "$KS" \
              --ks-key-alias "$ALIAS" \
              --ks-pass env:KEYSTORE_PASSWORD \
              --key-pass env:KEY_PASSWORD \
              --out "release-apks/$NAME" \
              "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" verify "release-apks/$NAME"
          done
          ls -la release-apks/*.apk

      - name: Upload ke GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: SmartTube ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          files: release-apks/*.apk
          generate_release_notes: true
